{% extends "base.html" %}

{% block title %}MORSE{% endblock %}

{% block content %}
    <h1>Vložení PDF certifikátu</h1>
       <input type="text" id="title" name="title" required>

        <label for="category">Kategorie:</label>
        <select id="category" name="category">
            <option>BOZP</option>
            <option>Požární ochrana</option>
            <option>IT bezpečnost</option>
            <option>Jiné</option>
        </select>

        <label for="file">Soubor (PDF):</label>
        <input type="file" id="file" name="file" accept=".pdf" required>

        <button type="submit">Nahrát dokument</button>
    </form>
{% endblock %}
