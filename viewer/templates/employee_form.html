{% extends "base.html" %}

{% block title %}Přidat zaměstnance{% endblock %}

{% block content %}
<h1>Vytvořit nového zaměstnance</h1>
<button class="back-button" onclick="history.back()">⬅ Zpět</button>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}

    {{ form.as_p }}  <!-- Zobrazí formulář jako odstavce (formulářová pole) -->

    <button type="submit">Uložit zaměstnance</button>
</form>
{% endblock %}
