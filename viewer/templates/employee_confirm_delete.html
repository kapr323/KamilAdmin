{% extends "base.html" %}
{% block title %}Smazat zaměstnance{% endblock %}

{% block content %}
<h1>Opravdu chcete smazat zaměstnance {{ employee.name }} {{ employee.surname }}?</h1>
<form method="post">

</form>
{% endblock %}
