{% extends "base.html" %}

{% block title %}Vytvořit nový záznam pracovníka na dohodu{% endblock %}

{% block content %}
<h1>Vytvořit nový záznam pracovníka na dohodu</h1>
<button class="back-button" onclick="history.back()">⬅ Zpět</button>

<form method="post" class="employee-form">
    {% csrf_token %}
    
    <div class="form-group">
        <label for="name">Jméno:</label>
        <input type="text" name="name" id="name" required class="form-control">
    </div>

    <div class="form-group">
        <label for="surname">Příjmení:</label>
        <input type="text" name="surname" id="surname" required class="form-control">
    </div>

    <div class="form-group">
        <label for="title_before_name">Titul před jménem:</label>
        <input type="text" name="title_before_name" id="title_before_name" required class="form-control">
    </div>

    <div class="form-group">
        <label for="name_of_contract">Název dohody:</label>
        <input type="text" name="name_of_contract" id="name_of_contract" required class="form-control">
    </div>

    <div class="form-group">
        <label for="contract_from">Smlouva od:</label>
        <input type="date" name="contract_from" id="contract_from" required class="form-control">
    </div>

    <div class="form-group">
        <label for="contract_until">Platnost smlouvy do:</label>
        <input type="date" name="contract_until" id="contract_until" required class="form-control">
    </div>

    <div class="form-group">
        <label for="type_of_agreement">Typ smlouvy:</label>
        <input type="text" name="type_of_agreement" id="type_of_agreement" required class="form-control">
    </div>

    <div class="form-group">
        <label for="hourly_wage">Hodinová mzda:</label>
        {{ form.hourly_wage }}
    </div>

    <button type="submit" class="btn btn-primary">Přidat pracovníka</button>
</form>
{% endblock %}
