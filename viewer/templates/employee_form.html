{% extends "base.html" %}

{% block title %}Upravit data zaměstnance{% endblock %}

{% block content %}
<h1>Upravit data zaměstnance</h1>
<button class="back-button" onclick="history.back()">⬅ Zpět</button>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Uložit zaměstnance</button>
</form>
{% endblock %}
