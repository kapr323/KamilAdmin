<!DOCTYPE html>
{% load static %}
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Přihlášení</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #212c95;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .logo {
            margin-bottom: 20px;
        }

        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            color: black;
            min-width: 220px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 8px;
            background-color: #212c95;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .errors {
            color: red;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <img src="{% static 'img/MORSE.ico' %}" alt="Logo firmy" height="300">
    </div>
    <form method="post">
        {% csrf_token %}
        {% if form.errors %}
            <div class="errors">
                Nesprávné jméno nebo heslo.
            </div>
        {% endif %}
        {{ form.username }}
        {{ form.password }}
        <button type="submit">Login</button>
    </form>
</div>
</body>
</html>
